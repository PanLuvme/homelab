name: Update Homelab Badge

on:
  schedule:
    - cron: '*/15 * * * *' # Polls Beszel every 15 minutes
  workflow_dispatch: # Allows you to run it manually

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Beszel Data & Generate JSON
        env:
          EMAIL: ${{ secrets.BESZEL_EMAIL }}
          PASSWORD: ${{ secrets.BESZEL_PASSWORD }}
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          
          # Using your public domain directly
          HUB_URL="https://beszel.pandashii.com"
          
          echo "Authenticating with Beszel Hub..."
          TOKEN=$(curl -s -f -X POST "${HUB_URL}/api/collections/users/auth-with-password" \
            -H "Content-Type: application/json" \
            -d "{\"identity\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" \
            | jq -r '.token')
            
          echo "Fetching system status..."
          SYSTEMS=$(curl -s -f "${HUB_URL}/api/collections/systems/records" \
            -H "Authorization: Bearer $TOKEN")
            
          TOTAL=$(echo "$SYSTEMS" | jq '.totalItems')
          UP=$(echo "$SYSTEMS" | jq '[.items[] | select(.status == "up")] | length')
          
          if [ "$UP" -eq "$TOTAL" ]; then
            COLOR="success"
          else
            COLOR="critical"
          fi
          
          cat <<EOF > badge.json
          {
            "schemaVersion": 1,
            "label": "Homelab",
            "message": "$UP / $TOTAL Online",
            "color": "$COLOR"
          }
          EOF
          
          echo "Pushing to Gist..."
          gh gist edit "$GIST_ID" badge.json
